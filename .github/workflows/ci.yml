name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  INFRA_REPO: matheusmafioletti/agentboard-infra

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_AUTH_SERVICE_URL: http://localhost:8080
          VITE_BOARD_SERVICE_URL: http://localhost:8081

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_AUTH_SERVICE_URL=${{ vars.DEMO_PUBLIC_URL }}
            VITE_BOARD_SERVICE_URL=${{ vars.DEMO_PUBLIC_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentboard-web:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentboard-web:${{ github.sha }}

      - name: Trigger infra deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DEPLOY_PAT }}
          repository: ${{ env.INFRA_REPO }}
          event-type: deploy-web
          client-payload: |
            {
              "web_tag": "${{ github.sha }}"
            }
