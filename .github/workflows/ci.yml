name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  E2E_PLAYWRIGHT_REPO: matheusmafioletti/agentboard-e2e-playwright
  E2E_CYPRESS_REPO: matheusmafioletti/agentboard-e2e-cypress
  E2E_SELENIUM_REPO: matheusmafioletti/agentboard-e2e-selenium
  QA_REPORTS_REPO: matheusmafioletti/agentboard-qa-reports

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**
          if-no-files-found: ignore

      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          VITE_AUTH_SERVICE_URL: http://localhost:8080
          VITE_BOARD_SERVICE_URL: http://localhost:8081

  publish-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web preview (demo URLs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_AUTH_SERVICE_URL=${{ vars.DEMO_PUBLIC_URL || 'https://agentboard.matheusmafioletti.com' }}
            VITE_BOARD_SERVICE_URL=${{ vars.DEMO_PUBLIC_URL || 'https://agentboard.matheusmafioletti.com' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentboard-web:${{ github.event.pull_request.head.sha }}

      - name: Build and push web preview (e2e)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_AUTH_SERVICE_URL=http://localhost:8080
            VITE_BOARD_SERVICE_URL=http://localhost:8080
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentboard-web:e2e-${{ github.event.pull_request.head.sha }}

  resolve-preview:
    needs: [build, publish-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      auth_tag: ${{ steps.meta.outputs.auth_tag }}
      board_tag: ${{ steps.meta.outputs.board_tag }}
      api_docs_tag: ${{ steps.meta.outputs.api_docs_tag }}
      web_tag: ${{ steps.meta.outputs.web_tag }}

    steps:
      - name: Resolve preview image tags
        id: meta
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "auth_tag=latest" >> "$GITHUB_OUTPUT"
          echo "board_tag=latest" >> "$GITHUB_OUTPUT"
          echo "api_docs_tag=latest" >> "$GITHUB_OUTPUT"
          echo "web_tag=e2e-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify preview images on GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull preview images
        run: |
          OWNER="${{ github.repository_owner }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          docker pull "${{ env.REGISTRY }}/${OWNER}/agentboard-web:e2e-${SHA}"
          for image in agentboard-auth agentboard-board agentboard-api-docs; do
            docker pull "${{ env.REGISTRY }}/${OWNER}/${image}:latest"
          done

  e2e-playwright:
    needs: [build, publish-preview, resolve-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_PLAYWRIGHT_REPO }}
          path: agentboard-e2e-playwright

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentboard-e2e-playwright/package-lock.json

      - name: Install dependencies
        working-directory: agentboard-e2e-playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start E2E stack
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Run @local tests
        working-directory: agentboard-e2e-playwright
        env:
          ENVIRONMENT: e2e
          TEST_TAGS: "@local"
          CI: true
        run: npm run test:local -- --project=chromium

      - name: Tear down E2E stack
        if: always()
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-allure-results
          path: agentboard-e2e-playwright/allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: agentboard-e2e-playwright/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  e2e-cypress:
    needs: [build, publish-preview, resolve-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout Cypress tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_CYPRESS_REPO }}
          path: agentboard-e2e-cypress

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentboard-e2e-cypress/package-lock.json

      - name: Install dependencies
        working-directory: agentboard-e2e-cypress
        run: npm ci

      - name: Start E2E stack
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Run @local tests
        working-directory: agentboard-e2e-cypress
        env:
          ENVIRONMENT: e2e
          TEST_TAGS: "@local"
          CI: true
        run: npm run test:local

      - name: Tear down E2E stack
        if: always()
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-mochawesome
          path: agentboard-e2e-cypress/cypress/reports/
          retention-days: 30
          if-no-files-found: ignore

  e2e-selenium:
    needs: [build, publish-preview, resolve-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout Selenium tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_SELENIUM_REPO }}
          path: agentboard-e2e-selenium

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: maven
          cache-dependency-path: agentboard-e2e-selenium/pom.xml

      - name: Start E2E stack
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Run @local Selenium tests
        working-directory: agentboard-e2e-selenium
        env:
          ENVIRONMENT: e2e
        run: |
          mvn test -Pe2e \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dcucumber.filter.tags="@e2e and @local and not @wip"

      - name: Tear down E2E stack
        if: always()
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-allure-results
          path: agentboard-e2e-selenium/target/allure-results
          retention-days: 30
          if-no-files-found: ignore

  prepare-reports-payload:
    needs: [e2e-playwright, e2e-cypress, e2e-selenium]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.payload.outputs.run_id }}
      results_json: ${{ steps.payload.outputs.results_json }}

    steps:
      - name: Build results payload
        id: payload
        run: |
          PR="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RUN_ID="web-pr-${PR:-0}-${SHORT_SHA}"

          result() {
            if [[ "${1}" == "success" ]]; then echo "pass"; else echo "fail"; fi
          }

          cat > /tmp/results.json <<EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "results": {
              "e2e-playwright": "$(result '${{ needs.e2e-playwright.result }}')",
              "e2e-cypress": "$(result '${{ needs.e2e-cypress.result }}')",
              "e2e-selenium": "$(result '${{ needs.e2e-selenium.result }}')"
            }
          }
          EOF

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "results_json=$(jq -c . /tmp/results.json)" >> "$GITHUB_OUTPUT"

  publish-reports-pr:
    needs: prepare-reports-payload
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: write
    uses: matheusmafioletti/agentboard-qa-reports/.github/workflows/publish-report.yml@main
    with:
      run_id: ${{ needs.prepare-reports-payload.outputs.run_id }}
      sha: ${{ github.event.pull_request.head.sha }}
      env: pr-local
      pr_number: ${{ github.event.pull_request.number }}
      results_json: ${{ needs.prepare-reports-payload.outputs.results_json }}
      source_repo: ${{ github.repository }}
      source_run_id: ${{ github.run_id }}
    secrets:
      QA_REPORTS_PAT: ${{ secrets.QA_REPORTS_PAT }}
      SOURCE_DOWNLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
